name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          # .slnx (the solution format this repo uses) needs a recent SDK.
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore TaskbarExtras.slnx

      - name: Build
        run: dotnet build TaskbarExtras.slnx -c Release --no-restore

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TaskbarExtras
          path: src/TaskbarExtras.App/bin/Release/net9.0-windows/
          if-no-files-found: error
